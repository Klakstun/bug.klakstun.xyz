<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你完了 · 这个页面被你点坏了</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: #111;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    text-align: center;
  }
  .glitch {
    font-size: clamp(32px, 8vw, 72px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    position: relative;
    animation: shake 0.3s infinite;
  }
  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0; top: 0;
    width: 100%;
  }
  .glitch::before { color: #ff3b3b; transform: translate(-3px, 2px); opacity: 0.7; }
  .glitch::after  { color: #3b8bff; transform: translate(3px, -2px); opacity: 0.7; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-2px,1px); }
    75% { transform: translate(2px,-1px); }
  }
  .sub {
    margin-top: 24px;
    font-size: clamp(14px, 3vw, 18px);
    color: #aaa;
    line-height: 1.8;
    max-width: 520px;
  }
  .sub b { color: #ff3b3b; }
  .btn {
    margin-top: 36px;
    padding: 14px 40px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: #ff3b3b;
    color: #fff;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn:hover { box-shadow: 0 0 24px rgba(255,59,59,0.7); }
  .btn:active { transform: scale(0.94); }
  .count {
    margin-top: 20px;
    font-size: 13px;
    color: #666;
    font-family: monospace;
  }
  .chaos {
    position: fixed;
    font-size: 40px;
    pointer-events: none;
    animation: fly 2s ease-out forwards;
    z-index: 99;
  }
  @keyframes fly {
    0% { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(2) rotate(360deg); }
  }
  body.meltdown { animation: hue 0.15s infinite; }
  @keyframes hue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
</style>
</head>
<body>

  <div class="glitch" data-text="你 完 了">你 完 了</div>
  <p class="sub">你刚刚点了一个<b>不该点的东西</b>。<br>系统已被你搞崩，正在逃跑……</p>
  <button class="btn" id="btn">再点一下试试</button>
  <div class="count" id="count">已作死 0 次</div>

<script>
(function () {
  'use strict';
  var btn = document.getElementById('btn');
  var countEl = document.getElementById('count');
  var n = 0;
  var emojis = ['💥','🔥','💀','👾','🚨','☠️','🧨','💣'];

  btn.addEventListener('click', function (e) {
    n++;
    countEl.textContent = '已作死 ' + n + ' 次';

    // 到处乱飞的表情
    var emoji = emojis[Math.floor(Math.random() * emojis.length)];
    var el = document.createElement('div');
    el.className = 'chaos';
    el.textContent = emoji;
    el.style.left = e.clientX + 'px';
    el.style.top = e.clientY + 'px';
    el.style.setProperty('--dx', (Math.random() * 400 - 200) + 'px');
    el.style.setProperty('--dy', (Math.random() * 400 - 200) + 'px');
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2000);

    // 点多了开始崩坏
    if (n === 5) document.body.classList.add('meltdown');
    if (n === 10) {
      document.querySelector('.sub').innerHTML = '别点了！<b>真的会出事的！</b>';
    }
    if (n === 20) {
      document.querySelector('.glitch').textContent = '求 求 你 别 点 了';
    }
  });
})();
</script>

</body>
</html>
