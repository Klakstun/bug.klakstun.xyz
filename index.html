<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUG 歼灭战 · 漏洞狩猎小游戏</title>
<style>
  /* ===== Material 3 默认浅色主题 Tokens ===== */
  :root {
    --md-primary: #6750A4;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #EADDFF;
    --md-on-primary-container: #21005D;
    --md-secondary: #625B71;
    --md-on-secondary: #FFFFFF;
    --md-secondary-container: #E8DEF8;
    --md-on-secondary-container: #1D192B;
    --md-tertiary: #7D5260;
    --md-tertiary-container: #FFD8E4;
    --md-on-tertiary-container: #31111D;
    --md-error: #B3261E;
    --md-on-error: #FFFFFF;
    --md-error-container: #F9DEDC;
    --md-on-error-container: #410E0B;
    --md-background: #FEF7FF;
    --md-on-background: #1D1B20;
    --md-surface: #FEF7FF;
    --md-on-surface: #1D1B20;
    --md-surface-variant: #E7E0EC;
    --md-on-surface-variant: #49454F;
    --md-surface-container-lowest: #FFFFFF;
    --md-surface-container-low: #F7F2FA;
    --md-surface-container: #F3EDF7;
    --md-surface-container-high: #ECE6F0;
    --md-surface-container-highest: #E6E0E9;
    --md-outline: #79747E;
    --md-outline-variant: #CAC4D0;
    --md-inverse-surface: #322F35;
    --md-inverse-on-surface: #F5EFF7;
    --md-success: #386A20;
    --md-success-container: #B8F397;
    --md-on-success-container: #042100;

    --radius-xs: 4px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 28px;

    --elev-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
    --elev-2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
    --elev-3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);

    --font: "Roboto Flex", "Roboto", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--md-background);
    color: var(--md-on-background);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ===== Top App Bar (Small) ===== */
  .app-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 64px;
    padding: 0 16px;
    background: var(--md-surface-container);
    color: var(--md-on-surface);
  }
  .app-bar__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.1px;
  }
  .app-bar__logo {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    background: var(--md-primary);
    color: var(--md-on-primary);
    display: grid; place-items: center;
    font-size: 16px;
  }
  .app-bar__score {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px;
    font-weight: 500;
    background: var(--md-secondary-container);
    color: var(--md-on-secondary-container);
    padding: 6px 14px;
    border-radius: var(--radius-xl);
  }
  .app-bar__score b { font-size: 16px; }

  /* ===== 布局 ===== */
  .page {
    max-width: 840px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ===== Hero ===== */
  .hero { text-align: center; padding: 8px 0 0; }
  .hero__eyebrow {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: var(--md-on-primary-container);
    background: var(--md-primary-container);
    padding: 6px 16px;
    border-radius: var(--radius-xl);
    margin-bottom: 16px;
  }
  .hero__title {
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.15;
    font-weight: 500;
    letter-spacing: -0.3px;
    margin-bottom: 10px;
  }
  .hero__sub {
    font-size: 15px;
    line-height: 22px;
    color: var(--md-on-surface-variant);
    max-width: 520px;
    margin: 0 auto;
  }

  /* ===== 游戏面板 Card ===== */
  .card {
    background: var(--md-surface-container-low);
    border-radius: var(--radius-md);
    padding: 20px;
  }
  .card__title {
    font-size: 20px;
    line-height: 28px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .card__desc {
    font-size: 13px;
    line-height: 20px;
    color: var(--md-on-surface-variant);
    margin-bottom: 16px;
  }

  /* ===== 游戏区 ===== */
  .field {
    position: relative;
    height: clamp(320px, 52vh, 460px);
    border-radius: var(--radius-md);
    background: var(--md-surface-container-lowest);
    border: 1px solid var(--md-outline-variant);
    overflow: hidden;
    cursor: crosshair;
    user-select: none;
    touch-action: manipulation;
  }
  .field.shake { animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .field__overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; text-align: center;
    padding: 24px;
    z-index: 5;
    background: var(--md-surface-container-lowest);
    transition: opacity 0.25s;
  }
  .field__overlay.hidden { opacity: 0; pointer-events: none; }
  .field__overlay h2 {
    font-size: 22px;
    font-weight: 500;
  }
  .field__overlay p {
    font-size: 14px;
    line-height: 22px;
    color: var(--md-on-surface-variant);
    max-width: 380px;
  }

  /* ===== Bug 目标 ===== */
  .bug {
    position: absolute;
    width: 56px; height: 56px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 28px;
    cursor: crosshair;
    transform: translate(-50%, -50%);
    will-change: transform;
    z-index: 3;
    background: var(--md-error-container);
    color: var(--md-on-error-container);
    box-shadow: var(--elev-1);
    animation: bob 1.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(-50%,-54%) scale(1.05); }
  }
  .bug:hover { box-shadow: var(--elev-2); }
  .bug--gold {
    background: var(--md-tertiary-container);
    color: var(--md-on-tertiary-container);
    box-shadow: 0 0 0 3px var(--md-tertiary-container), var(--elev-2);
  }
  .bug--glitch {
    background: var(--md-primary-container);
    color: var(--md-on-primary-container);
    animation: wobble 0.6s ease-in-out infinite alternate;
  }
  @keyframes wobble {
    from { transform: translate(-50%,-50%) rotate(-10deg); }
    to { transform: translate(-50%,-50%) rotate(10deg); }
  }

  /* 命中特效 */
  .pop {
    position: absolute;
    font-size: 14px;
    font-weight: 700;
    pointer-events: none;
    transform: translate(-50%,-50%);
    animation: popOut 0.7s cubic-bezier(.2,.8,.3,1) forwards;
    z-index: 6;
    white-space: nowrap;
  }
  @keyframes popOut {
    0% { opacity: 1; transform: translate(-50%,-50%) scale(0.6); }
    30% { opacity: 1; transform: translate(-50%,-120%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-200%) scale(1); }
  }
  .pop--ok { color: var(--md-success); }
  .pop--gold { color: var(--md-tertiary); }
  .pop--miss { color: var(--md-error); }

  .ring {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 2px solid var(--md-primary);
    transform: translate(-50%,-50%);
    pointer-events: none;
    animation: ringExpand 0.45s ease-out forwards;
    z-index: 4;
  }
  @keyframes ringExpand {
    to { width: 96px; height: 96px; opacity: 0; border-width: 1px; }
  }

  /* ===== 底部 HUD ===== */
  .hud {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between;
    margin-top: 16px;
  }
  .hud__stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat {
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    background: var(--md-surface-container-high);
    min-width: 84px;
  }
  .stat__label {
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--md-on-surface-variant);
  }
  .stat__value { font-size: 18px; font-weight: 700; color: var(--md-primary); }
  .stat--time .stat__value { color: var(--md-tertiary); }
  .stat--miss .stat__value { color: var(--md-error); }

  /* ===== 按钮 ===== */
  .btn {
    appearance: none; border: none; font-family: inherit;
    font-size: 14px; font-weight: 500; letter-spacing: 0.1px;
    padding: 10px 24px;
    border-radius: var(--radius-xl);
    cursor: pointer;
    transition: box-shadow 0.15s, filter 0.15s, background 0.15s;
  }
  .btn:active { filter: brightness(0.94); }
  .btn--filled {
    background: var(--md-primary);
    color: var(--md-on-primary);
  }
  .btn--filled:hover { box-shadow: var(--elev-1); }
  .btn--tonal {
    background: var(--md-secondary-container);
    color: var(--md-on-secondary-container);
  }
  .btn--tonal:hover { box-shadow: var(--elev-1); }
  .btn--text {
    background: transparent;
    color: var(--md-primary);
    padding: 10px 12px;
  }
  .btn--text:hover { background: var(--md-primary-container); }

  /* ===== 日志终端 ===== */
  .terminal {
    background: var(--md-surface-container);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    font-family: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    line-height: 1.9;
    color: var(--md-on-surface-variant);
    max-height: 150px;
    overflow-y: auto;
  }
  .terminal__line { display: flex; gap: 10px; }
  .terminal__time { color: var(--md-outline); flex-shrink: 0; }
  .terminal__ok { color: var(--md-success); }
  .terminal__warn { color: var(--md-tertiary); }
  .terminal__err { color: var(--md-error); }
  .terminal__sys { color: var(--md-primary); }

  /* ===== 结算对话框 ===== */
  .dialog-scrim {
    position: fixed; inset: 0; z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(0,0,0,0.32);
  }
  .dialog-scrim.show { display: flex; }
  .dialog {
    width: 100%; max-width: 360px;
    background: var(--md-surface-container-high);
    border-radius: var(--radius-xl);
    padding: 24px;
    box-shadow: var(--elev-3);
    text-align: center;
    animation: dialogIn 0.2s ease-out;
  }
  @keyframes dialogIn {
    from { opacity: 0; transform: scale(0.92); }
  }
  .dialog__icon {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--md-primary-container);
    color: var(--md-on-primary-container);
    display: grid; place-items: center;
    font-size: 28px;
  }
  .dialog__title {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .dialog__text {
    font-size: 14px;
    line-height: 22px;
    color: var(--md-on-surface-variant);
    margin-bottom: 20px;
  }
  .dialog__score {
    font-size: 40px;
    font-weight: 700;
    color: var(--md-primary);
    line-height: 1;
    margin-bottom: 4px;
  }
  .dialog__rank {
    font-size: 13px;
    color: var(--md-tertiary);
    margin-bottom: 20px;
  }
  .dialog__actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--md-on-surface-variant);
    padding: 24px 16px 40px;
  }

  @media (max-width: 480px) {
    .app-bar__brand span:last-child { font-size: 16px; }
    .hud { flex-direction: column; align-items: stretch; }
    .hud__actions { justify-content: stretch; }
    .hud__actions .btn { flex: 1; }
  }
</style>
</head>
<body>

<!-- Top App Bar -->
<header class="app-bar">
  <div class="app-bar__brand">
    <span class="app-bar__logo">🐞</span>
    <span>BUG 歼灭战</span>
  </div>
  <div class="app-bar__score">得分 <b id="topScore">0</b></div>
</header>

<main class="page">

  <!-- Hero -->
  <section class="hero">
    <span class="hero__eyebrow">BUG HUNTING MINI GAME</span>
    <h1 class="hero__title">点击消灭乱飞的 Bug</h1>
    <p class="hero__sub">30 秒内尽可能多地拍死 bug。金色 bug 双倍分，紫色 bug 三倍分，打空会扣时间。</p>
  </section>

  <!-- 游戏卡 -->
  <section class="card">
    <h2 class="card__title">狩猎场</h2>
    <p class="card__desc">鼠标或手指点击 bug 即可。小心别点空。</p>

    <div class="field" id="field">
      <div class="field__overlay" id="overlay">
        <h2>准备好了吗？</h2>
        <p>点击下方按钮开始。30 秒倒计时，看看你能消灭多少只 bug。</p>
        <button class="btn btn--filled" id="startBtn">开始狩猎</button>
      </div>
    </div>

    <div class="hud">
      <div class="hud__stats">
        <div class="stat">
          <span class="stat__label">剩余时间</span>
          <span class="stat__value" id="timeLeft">30s</span>
        </div>
        <div class="stat">
          <span class="stat__label">击杀</span>
          <span class="stat__value" id="kills">0</span>
        </div>
        <div class="stat stat--miss">
          <span class="stat__label">打空</span>
          <span class="stat__value" id="misses">0</span>
        </div>
        <div class="stat">
          <span class="stat__label">连击</span>
          <span class="stat__value" id="combo">0</span>
        </div>
      </div>
      <div class="hud__actions">
        <button class="btn btn--tonal" id="restartBtn">重新开始</button>
      </div>
    </div>
  </section>

  <!-- 日志 -->
  <section class="card">
    <h2 class="card__title">狩猎日志</h2>
    <p class="card__desc">你的每一次出手都会被记录。</p>
    <div class="terminal" id="terminal">
      <div class="terminal__line">
        <span class="terminal__time">--:--</span>
        <span class="terminal__sys">系统就绪，等待开始…</span>
      </div>
    </div>
  </section>

</main>

<!-- 结算对话框 -->
<div class="dialog-scrim" id="dialogScrim">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog__icon">🏆</div>
    <h2 class="dialog__title">狩猎结束</h2>
    <div class="dialog__score" id="finalScore">0</div>
    <div class="dialog__rank" id="finalRank">菜鸟捕虫员</div>
    <p class="dialog__text" id="finalText">再来一局？</p>
    <div class="dialog__actions">
      <button class="btn btn--text" id="closeDialogBtn">关闭</button>
      <button class="btn btn--filled" id="againBtn">再来一局</button>
    </div>
  </div>
</div>

<footer>纯属娱乐 · 与任何真实漏洞无关</footer>

<script>
(function () {
  const field    = document.getElementById('field');
  const overlay  = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const topScoreEl = document.getElementById('topScore');
  const timeLeftEl = document.getElementById('timeLeft');
  const killsEl    = document.getElementById('kills');
  const missesEl   = document.getElementById('misses');
  const comboEl    = document.getElementById('combo');
  const terminal   = document.getElementById('terminal');
  const dialogScrim = document.getElementById('dialogScrim');
  const finalScore  = document.getElementById('finalScore');
  const finalRank   = document.getElementById('finalRank');
  const finalText   = document.getElementById('finalText');
  const closeDialogBtn = document.getElementById('closeDialogBtn');
  const againBtn = document.getElementById('againBtn');

  const GAME_TIME = 30;      // 秒
  const SPAWN_MIN = 420;     // 最小生成间隔 ms
  const SPAWN_MAX = 780;
  const MAX_BUGS  = 5;       // 场上最多 bug 数

  let running = false;
  let score = 0;
  let kills = 0;
  let misses = 0;
  let combo = 0;
  let maxCombo = 0;
  let timeLeft = GAME_TIME;
  let timerId = null;
  let spawnId = null;
  let bugIdCounter = 0;

  const bugEmoji = ['🐞', '🪲', '🐛', '🦟'];
  const ranks = [
    { min: 0,   name: '菜鸟捕虫员' },
    { min: 10,  name: '初级除虫师' },
    { min: 25,  name: '资深猎手' },
    { min: 40,  name: 'Bug 终结者' },
    { min: 60,  name: '传说级灭虫王' }
  ];

  function pad(n) { return String(n).padStart(2, '0'); }

  function log(msg, type) {
    const now = new Date();
    const line = document.createElement('div');
    line.className = 'terminal__line';
    line.innerHTML =
      '<span class="terminal__time">' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()) + '</span>' +
      '<span class="terminal__' + (type || 'sys') + '">' + msg + '</span>';
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
    while (terminal.children.length > 60) terminal.removeChild(terminal.firstChild);
  }

  function updateHUD() {
    topScoreEl.textContent = score;
    timeLeftEl.textContent = timeLeft + 's';
    killsEl.textContent = kills;
    missesEl.textContent = misses;
    comboEl.textContent = combo;
  }

  function clearBugs() {
    field.querySelectorAll('.bug, .pop, .ring').forEach(el => el.remove());
  }

  function spawnBug() {
    if (!running) return;
    if (field.querySelectorAll('.bug').length >= MAX_BUGS) return;

    const rect = field.getBoundingClientRect();
    const pad = 40;
    const x = pad + Math.random() * (rect.width - pad * 2);
    const y = pad + Math.random() * (rect.height - pad * 2);

    const roll = Math.random();
    let type = 'normal';
    if (roll > 0.9) type = 'glitch';
    else if (roll > 0.72) type = 'gold';

    const bug = document.createElement('div');
    bug.className = 'bug' + (type === 'gold' ? ' bug--gold' : type === 'glitch' ? ' bug--glitch' : '');
    bug.dataset.type = type;
    bug.dataset.id = ++bugIdCounter;
    bug.style.left = x + 'px';
    bug.style.top = y + 'px';
    bug.style.animationDuration = (1.1 + Math.random() * 0.7) + 's';
    bug.textContent = bugEmoji[Math.floor(Math.random() * bugEmoji.length)];

    bug.addEventListener('pointerdown', onHitBug);
    field.appendChild(bug);

    const life = 1400 + Math.random() * 1200;
    bug._lifeTimer = setTimeout(() => {
      if (bug.parentNode) bug.remove();
    }, life);
  }

  function scheduleSpawn() {
    if (!running) return;
    const delay = SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);
    spawnId = setTimeout(() => {
      spawnBug();
      scheduleSpawn();
    }, delay);
  }

  function onHitBug(e) {
    e.stopPropagation();
    if (!running) return;
    const bug = e.currentTarget;
    const type = bug.dataset.type;
    const rect = field.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    let points = 1;
    if (type === 'gold') points = 2;
    if (type === 'glitch') points = 3;

    combo++;
    maxCombo = Math.max(maxCombo, combo);
    const comboBonus = combo >= 5 ? 1 : 0;
    score += points + comboBonus;
    kills++;

    const label = type === 'gold' ? '+2 金色!' : type === 'glitch' ? '+3 稀有!' : '+1';
    showPop(x, y, label + (comboBonus ? ' 连击!' : ''), type === 'normal' ? 'ok' : type === 'gold' ? 'gold' : 'ok');
    showRing(x, y);
    log('击杀 #' + bug.dataset.id + ' [' + type + '] +' + (points + comboBonus) + '分', 'ok');

    clearTimeout(bug._lifeTimer);
    bug.remove();
    updateHUD();
  }

  function onMiss(e) {
    if (!running) return;
    // 只处理点击空白区域
    if (e.target.closest('.bug')) return;
    const rect = field.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    combo = 0;
    misses++;
    timeLeft = Math.max(0, timeLeft - 1);
    showPop(x, y, '打空 -1s', 'miss');
    log('打空，扣 1 秒', 'err');
    field.classList.add('shake');
    setTimeout(() => field.classList.remove('shake'), 300);
    updateHUD();
    if (timeLeft <= 0) endGame();
  }

  function showPop(x, y, text, cls) {
    const el = document.createElement('div');
    el.className = 'pop pop--' + (cls || 'ok');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    field.appendChild(el);
    setTimeout(() => el.remove(), 750);
  }

  function showRing(x, y) {
    const el = document.createElement('div');
    el.className = 'ring';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    field.appendChild(el);
    setTimeout(() => el.remove(), 500);
  }
